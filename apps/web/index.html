<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Remote Agent Bridge</title>
  <style>
    :root{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;--ink:#172033;--muted:#788399;--line:#e6eaf1;--blue:#4667f2;--blue2:#eef1ff;--card:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
    .shell{display:grid;grid-template-columns:285px minmax(0,1fr);height:100vh;max-width:1440px;margin:auto;background:var(--card);box-shadow:0 12px 50px #28304d12}.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fbfcff;padding:22px 16px;min-width:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:2px 8px 24px}.logo{display:grid;place-items:center;width:34px;height:34px;color:#fff;border-radius:11px;background:linear-gradient(135deg,#6a7eff,#324edc);box-shadow:0 8px 18px #4667f23b}.side-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:0 8px 8px}.icon-btn{width:32px;height:32px;border-radius:9px;background:var(--blue2);color:var(--blue);font-size:20px}.session-list{overflow:auto;flex:1}.session-item{display:flex;align-items:center;gap:4px;width:100%;border-radius:11px;color:var(--ink);margin:3px 0}.session-item:hover{background:#f0f3fa}.session-item.active{background:var(--blue2);color:#2e4ddd}.session-open{flex:1;min-width:0;text-align:left;background:transparent;padding:11px 10px;border-radius:11px;color:inherit}.session-open:hover{background:transparent;box-shadow:none;transform:none}.session-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{display:block;color:var(--muted);font-size:11px;margin-top:2px}.session-delete{flex:0 0 28px;width:28px;padding:6px 0;margin-right:5px;background:transparent;color:#9aa3b4;border-radius:8px;font-size:16px}.session-delete:hover{background:#fff0f1;color:#c54b5a;box-shadow:none;transform:none}.side-foot{border-top:1px solid var(--line);padding:14px 8px 0}.device-pill{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#c6ccd8}.dot.on{background:#24b47e;box-shadow:0 0 0 4px #24b47e1c}.main{display:flex;flex-direction:column;min-width:0;background:#fff}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top-title{font-weight:750}.top-sub{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.ghost{background:#f5f7fb;color:#536078;padding:9px 12px;border-radius:9px}.chat{flex:1;overflow:auto;padding:34px max(20px,calc((100% - 780px)/2));}.welcome{text-align:center;max-width:520px;margin:9vh auto 0}.welcome-mark{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;margin:0 auto 18px;color:#fff;background:linear-gradient(135deg,#6b80ff,#3954da);font-size:25px;box-shadow:0 12px 24px #4667f232}.welcome h1{font-size:28px;margin:0 0 8px;letter-spacing:-.03em}.welcome p{color:var(--muted);margin:0}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:25px}.suggestion{text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:#56627b}.suggestion:hover{border-color:#bbc6ff;background:#fafbff}.message{display:flex;gap:11px;margin:0 auto 24px;max-width:780px}.avatar{flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#e9edff;color:#3f5ee9;font-size:12px;font-weight:800}.message.user .avatar{background:#172033;color:#fff}.bubble{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding:7px 0;color:#29344c}.message.user .bubble{background:#f4f6fa;padding:10px 13px;border-radius:4px 13px 13px 13px}.event{font-size:12px;color:var(--muted);margin:-15px 0 22px 42px}.composer-wrap{padding:12px max(20px,calc((100% - 780px)/2)) 20px;background:linear-gradient(transparent,#fff 20%)}.composer{display:flex;align-items:flex-end;gap:9px;border:1px solid #dfe4ee;border-radius:16px;padding:10px;background:#fff;box-shadow:0 8px 25px #26345110}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:130px;padding:8px 2px;color:var(--ink);background:transparent}.send{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;font-size:18px}.composer-note{color:#9aa3b4;font-size:11px;text-align:center;margin-top:7px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#dfe5ff,transparent 35%),#f5f7fb}.auth-card{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 55px #2e3d7417}.auth-card h1{margin:0 0 7px}.auth-card p{color:var(--muted);margin:0 0 24px}.field{display:block;color:#536078;font-size:12px;font-weight:700;margin:14px 0 6px}.field input{width:100%;border:1px solid #d8deea;border-radius:10px;padding:12px;outline:none}.field input:focus{border-color:#7388ff;box-shadow:0 0 0 3px #4667f21b}.primary{width:100%;margin-top:18px;padding:12px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}.auth-switch{display:flex;gap:8px;margin-top:12px}.auth-switch button{flex:1;padding:10px;border-radius:10px;background:#f4f6fa;color:#58647b}.error{color:#d04457;font-size:12px;margin-top:10px;min-height:18px}
    @media(max-width:760px){.shell{display:block;height:100dvh}.side{display:none}.topbar{height:62px;padding:0 16px}.chat{padding:22px 16px}.composer-wrap{padding:10px 12px 14px}.welcome{margin-top:12vh}.suggestions{grid-template-columns:1fr}.top-actions .ghost{padding:8px}.message{margin-bottom:20px}.bubble{font-size:15px}}
    .provider-select{max-width:180px;border:0;background:#f5f7fb;color:#536078;padding:8px;border-radius:9px;outline:none}
    .actions{margin:-14px 0 22px 42px;max-width:780px;font-size:12px;color:#5a6579}
    .actions summary{cursor:pointer;color:#3f5ee9;font-weight:700;padding:4px 0;list-style:none}
    .actions summary::-webkit-details-marker{display:none}
    .actions summary::before{content:'▸ ';font-size:10px}
    .actions[open] summary::before{content:'▾ '}
    .action{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px dashed #edf0f6}
    .action code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;color:#39445c}
    .action .exit{flex:0 0 auto;font-weight:700;color:#24b47e}
    .action .exit.bad{color:#d04457}
    .action.error code{color:#b26b3f}
  </style>
</head>
<body>
  <section id="authView" class="auth">
    <div class="auth-card">
      <div class="brand" style="padding:0 0 20px"><span class="logo">↗</span> Remote Agent</div>
      <h1 id="authTitle">登录你的电脑</h1><p id="authHint">从手机安全连接到常开的电脑 Agent。</p>
      <label class="field">邮箱<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label class="field">密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位"></label>
      <button id="authButton" class="primary" onclick="submitAuth()">登录</button>
      <div class="auth-switch"><button onclick="setAuthMode('login')">已有账号</button><button onclick="setAuthMode('register')">创建账号</button></div>
      <div id="authError" class="error"></div>
    </div>
  </section>
  <section id="appView" class="shell hidden">
    <aside class="side"><div class="brand"><span class="logo">↗</span> Remote Agent</div><div class="side-title"><span>我的会话</span><button class="icon-btn" onclick="createSession()">+</button></div><div id="sessionList" class="session-list"></div><div class="side-foot"><div class="device-pill"><span id="deviceDot" class="dot"></span><span id="deviceText">正在连接电脑…</span></div></div></aside>
    <main class="main"><header class="topbar"><div><div id="currentTitle" class="top-title">新会话</div><div id="currentSub" class="top-sub">WorkBuddy · 隔离模式</div></div><div class="top-actions"><select id="providerSelect" class="provider-select" title="新会话使用的 Agent"></select><button class="ghost" onclick="pairDevice()">绑定电脑</button><button class="ghost" onclick="openSetup()">配置</button><button class="ghost" onclick="logout()">退出</button></div></header><section id="chat" class="chat"></section><div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="问问你的电脑…" onkeydown="handleKey(event)"></textarea><button class="send" onclick="sendTask()">↑</button></div><div class="composer-note">Agent 在隔离模式后台执行，不会抢占当前桌面</div></div></main>
  </section>
  <script>
    const API = window.location.origin; let token = sessionStorage.getItem('rab_token') || ''; let authMode='login'; let sessions=[]; let providers=[]; let currentSession=null; let poller=null;
    const $ = id => document.getElementById(id);
    async function api(path, options={}){const r=await fetch(API+path,{...options,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({error:'服务器返回无效内容'}));if(r.status===401&&path!=='/api/auth/login'){logout();throw Error('unauthorized')}return d}
    function setAuthMode(mode){authMode=mode;$('authTitle').textContent=mode==='login'?'登录你的电脑':'创建远程账号';$('authButton').textContent=mode==='login'?'登录':'注册';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('authError').textContent=''}
    async function submitAuth(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8){$('authError').textContent='请输入邮箱和至少 8 位密码';return}try{const d=await api('/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({email,password})});if(!d.token){$('authError').textContent=d.error||'登录失败';return}token=d.token;sessionStorage.setItem('rab_token',token);await showApp()}catch(e){$('authError').textContent=e.message}}
    async function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');await refreshDevice();await loadProviders();await loadSessions(); }
    function logout(){token='';sessionStorage.removeItem('rab_token');if(poller)clearInterval(poller);$('appView').classList.add('hidden');$('authView').classList.remove('hidden')}
    function renderActions(actions){if(!Array.isArray(actions)||!actions.length)return;const d=document.createElement('details');d.className='actions';const s=document.createElement('summary');s.textContent='做了什么（'+actions.length+' 步）';d.append(s);actions.forEach(a=>{const line=document.createElement('div');line.className='action '+(a.kind||'');const code=document.createElement('code');code.textContent=a.detail||'';line.append(code);if(a.exit_code!==undefined&&a.exit_code!==null){const r=document.createElement('span');r.className='exit'+(a.exit_code===0?'':' bad');r.textContent='exit='+a.exit_code;line.append(r)}d.append(line)});$('chat').append(d)}
    function addMessage(role,text,kind='',actions){const row=document.createElement('div');row.className='message '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'你':'AI';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(avatar,bubble);$('chat').append(row);if(kind){const event=document.createElement('div');event.className='event';event.textContent=kind;$('chat').append(event)}renderActions(actions);$('chat').scrollTop=$('chat').scrollHeight}
    function renderWelcome(){ $('chat').innerHTML='';const wrap=document.createElement('div');wrap.className='welcome';wrap.innerHTML='<div class="welcome-mark">✦</div><h1>从手机开始控制你的电脑</h1><p>我会在后台帮你处理任务，不打断你正在进行的游戏或工作。</p>';const suggestions=document.createElement('div');suggestions.className='suggestions';['查看电脑当前时间','列出当前工作目录的文件','显示电脑系统信息','查看正在运行的进程'].forEach(text=>{const b=document.createElement('button');b.className='suggestion';b.textContent=text;b.onclick=()=>{ $('input').value=text;sendTask() };suggestions.append(b)});wrap.append(suggestions);$('chat').append(wrap)}
    async function loadProviders(){providers=await api('/api/providers');if(!Array.isArray(providers))providers=[];providerSelect.innerHTML='';providers.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;providerSelect.append(o)});if(providers.some(p=>p.id==='workbuddy'))providerSelect.value='workbuddy';}
    function selectedProvider(){return providerSelect.value||providers[0]?.id||'local'}
    async function loadSessions(){sessions=await api('/api/sessions');$('sessionList').innerHTML='';sessions.forEach(s=>{const row=document.createElement('div');row.className='session-item';row.dataset.id=s.id;const open=document.createElement('button');open.className='session-open';const n=document.createElement('div');n.className='session-name';n.textContent=s.title;const m=document.createElement('span');m.className='session-meta';m.textContent=s.provider_id+' · '+new Date(s.updated_at).toLocaleDateString();open.append(n,m);open.onclick=()=>switchSession(s.id);const remove=document.createElement('button');remove.className='session-delete';remove.title='删除会话';remove.textContent='×';remove.onclick=e=>{e.stopPropagation();deleteSession(s.id)};row.append(open,remove);$('sessionList').append(row)});if(!sessions.length){await createSession()}else await switchSession(currentSession?.id&&sessions.some(x=>x.id===currentSession.id)?currentSession.id:sessions[0].id)}
    async function deleteSession(id){const s=sessions.find(x=>x.id===id);if(!s||!confirm('删除这个会话及其手机端历史记录？'))return;const d=await api('/api/sessions/'+encodeURIComponent(id),{method:'DELETE'});if(!d.deleted){addMessage('assistant',d.error||'删除会话失败');return}if(currentSession?.id===id)currentSession=null;await loadSessions()}
    async function createSession(){const provider=selectedProvider();const d=await api('/api/sessions',{method:'POST',body:JSON.stringify({provider_id:provider,title:(providers.find(p=>p.id===provider)?.name||'Agent')+' · '+new Date().toLocaleTimeString()})});if(d.session){sessions.unshift(d.session);await loadSessions()}}
    async function switchSession(id){const s=sessions.find(x=>x.id===id);if(!s)return;currentSession=s;document.querySelectorAll('.session-item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('currentTitle').textContent=s.title;$('currentSub').textContent=s.provider_id+' · 隔离模式';const messages=await api('/api/sessions/'+encodeURIComponent(id)+'/messages');$('chat').innerHTML='';if(!messages.length)renderWelcome();else messages.forEach(m=>addMessage(m.role,m.content));if(poller)clearInterval(poller);poller=setInterval(()=>refreshEvents(),1800)}
    const PENDING_CAP=100;
    function readPending(){try{const v=JSON.parse(localStorage.getItem('rab_pending_tasks')||'[]');return Array.isArray(v)?v.filter(x=>typeof x==='string'):[]}catch{return[]}}
    function writePending(list){try{localStorage.setItem('rab_pending_tasks',JSON.stringify(list.slice(-PENDING_CAP)))}catch{}}
    async function refreshEvents(){
      if(!currentSession)return;
      const pending=readPending();if(!pending.length)return;
      // The Gateway holds the authoritative record of every task this account
      // submitted; this local list is only a hint about which ids the phone is
      // still waiting on. Reconciling against the server is what stops a task
      // that already finished — or was lost to a Gateway restart — from being
      // polled forever, which is what the old code did on a 404.
      const known=await api('/api/tasks');
      const byId=new Map((Array.isArray(known)?known:[]).map(t=>[t.task_id,t]));
      const keep=[];
      for(const id of pending){
        const t=byId.get(id);
        if(!t)continue;                                       // no record anywhere: nothing will ever resolve it
        if(t.state==='queued'||t.state==='running'){keep.push(id);continue}
        // Terminal: show it here if it belongs to the open session. Results
        // from other sessions are already in that session's history.
        if(t.session_id===currentSession.id)addMessage('assistant',t.message,t.state==='succeeded'?'已完成':'任务状态：'+t.state,t.actions);
      }
      writePending(keep);
    }
    async function sendTask(){const text=$('input').value.trim();if(!text||!currentSession)return;addMessage('user',text);$('input').value='';const id=crypto.randomUUID();const d=await api('/api/tasks',{method:'POST',body:JSON.stringify({task_id:id,input:text,provider_id:currentSession.provider_id,session_id:currentSession.id,mode:'isolated'})});if(!d.accepted){addMessage('assistant',d.error||'任务发送失败');return}
      // Track the id only once the server has actually recorded it: an id that
      // was never accepted has nothing to reconcile against later.
      writePending([...readPending(),id])}
    function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask()}}
    async function refreshDevice(){try{const h=await fetch(API+'/health').then(r=>r.json());const online=!!h.agentOnline;$('deviceDot').classList.toggle('on',online);$('deviceText').textContent=online?'电脑在线 · '+(h.agent?.platform||'Agent'):'电脑离线'}catch{$('deviceText').textContent='Gateway 未连接'}}
    async function pairDevice(){const code=window.prompt('请输入电脑配置页显示的 6 位配对码');if(!code)return;const d=await api('/api/pairings/authorize',{method:'POST',body:JSON.stringify({code:code.trim()})});if(d.authorized){addMessage('assistant','电脑绑定成功。以后 Agent 重启或 Gateway 重启都不需要再次配对。');await refreshDevice()}else addMessage('assistant',d.error||'配对失败')}
    function openSetup(){window.location.href=API+'/setup'}
    if(token)showApp().catch(()=>logout());else setAuthMode('login');
  </script>
</body>
</html>
