<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102322">
  <title>Remote Agent Bridge · 电脑工作台</title>
  <link rel="stylesheet" href="/assets/chat.css">
  <script src="/assets/chat.js" defer></script>
</head>
<body>
  <section id="authView" class="auth" aria-labelledby="authTitle">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>Remote Agent Bridge<small>自托管 · 电脑工作台</small></span></div>
      <h1 id="authTitle">登录你的工作台</h1>
      <p>登录后，用电脑配置页的配对码绑定你的电脑。</p>
      <form id="authForm">
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位" minlength="8" maxlength="512" required>
        <button id="authButton" class="primary wide" type="submit">登录</button>
      </form>
      <button id="authSwitch" class="link" type="button">没有账号？创建账号</button>
      <p id="authError" class="form-error" role="alert" hidden></p>
      <p class="auth-foot">仅用于你信任的本机或私有网络。不要把服务端口直接暴露到公网。</p>
    </div>
  </section>

  <div id="appView" class="shell" hidden>
    <button id="sidebarOverlay" class="overlay" type="button" aria-label="关闭会话列表" tabindex="-1" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="工作台导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>Remote Agent Bridge<small>电脑工作台</small></span></div>
      <div class="sidebar-tools">
        <div class="sidebar-heading">会话</div>
        <button id="closeSidebar" class="sidebar-close" type="button" aria-label="关闭会话列表">×</button>
        <label for="providerSelect">新会话使用的执行器</label>
        <select id="providerSelect" disabled><option>正在读取…</option></select>
        <button id="newSession" class="new-session" type="button" disabled>＋ 新建会话</button>
      </div>
      <nav id="sessionList" class="session-list" aria-label="我的会话"></nav>
      <div class="sidebar-footer">
        <span>任务在已绑定的电脑执行</span>
        <button id="revokeDevice" class="link" type="button" hidden>解除电脑绑定</button>
        <button id="logout" class="link" type="button">退出此标签页</button>
      </div>
    </aside>

    <main class="main" id="main" aria-label="当前会话">
      <header class="topbar">
        <button id="openSidebar" class="icon mobile-menu" type="button" aria-label="打开会话和账户菜单" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="top-title">
          <div class="eyebrow">工作台</div>
          <h1 id="currentTitle">正在读取会话…</h1>
          <p id="currentSub" hidden></p>
        </div>
        <div class="top-actions">
          <div id="deviceStatus" class="device-status" role="status"><span class="dot" aria-hidden="true"></span><span id="deviceText">检查电脑状态</span></div>
          <button id="pairOpen" class="secondary" type="button">绑定电脑</button>
          <a id="setupLink" class="secondary" href="/setup" hidden>本机配置</a>
        </div>
      </header>
      <div id="connectionNotice" class="notice warning" role="status" hidden></div>
      <section id="chat" class="chat" aria-label="消息和任务记录"></section>
      <section class="composer-wrap" aria-label="提交任务">
        <p id="appNotice" class="notice" role="status" hidden></p>
        <div id="pendingSubmission" class="pending" role="region" aria-label="待核对的提交" hidden>
          <strong id="pendingTitle">等待发送回执</strong>
          <p id="pendingHint"></p>
          <div class="button-row">
            <button id="retryTask" class="primary" type="button">用原任务编号重试</button>
            <button id="checkTask" class="secondary" type="button">查询记录</button>
            <button id="discardTask" class="link" type="button">放弃重试</button>
          </div>
        </div>
        <form id="composer" class="composer">
          <label class="sr-only" for="input">告诉电脑要做什么</label>
          <textarea id="input" rows="2" maxlength="32768" placeholder="告诉电脑要做什么…" aria-describedby="composerHint"></textarea>
          <button id="sendTask" class="primary" type="submit" disabled>发送 <span aria-hidden="true">↑</span></button>
        </form>
        <p id="composerHint" class="composer-hint">后台执行 · 状态以 Gateway 记录为准</p>
      </section>
    </main>
  </div>

  <dialog id="pairDialog" aria-labelledby="pairTitle">
    <form id="pairForm">
      <h2 id="pairTitle">绑定你的电脑</h2>
      <p>在电脑上运行 <code>pnpm setup</code>，生成一次性配对码。配对码有效期为 60 秒。</p>
      <label for="pairCode">6 位配对码</label>
      <input id="pairCode" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <p id="pairError" class="form-error" role="alert" hidden></p>
      <div class="button-row dialog-buttons">
        <button id="pairClose" class="secondary" type="button">返回</button>
        <button id="pairSubmit" class="primary" type="submit">确认绑定</button>
      </div>
    </form>
  </dialog>
</body>
</html>
